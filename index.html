<!DOCTYPE html>
<html lang="zh-Hant" style="background-color: transparent;"><head>
    <script>
      (function() {
        // Capture host references before any artifact code runs: Window.parent
        // is [Replaceable] (a top-level `var parent` in artifact code would
        // replace the accessor with a data property), and a top-level
        // `const crypto` would shadow the global — either would otherwise
        // silently break the bridge for artifacts that worked before.
        const realParent = window.parent;
        const cryptoObj = window.crypto;
        // html-to-image is only used by takeScreenshot: fetched on first use, not as a
        // parser-blocking tag. Native fetch, captured before the proxy override below.
        const realFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : null;
        const HTML_TO_IMAGE_SRC = "https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.13/html-to-image.min.js";
        const HTML_TO_IMAGE_INTEGRITY = "sha512-iZ2ORl595Wx6miw+GuadDet4WQbdSWS3JLMoNfY8cRGoEFy6oT3G9IbcrBeL6AfkgpA51ETt/faX6yLV+/gFJg==";
        let htmlToImageLoad = null;
        const loadHtmlToImage = () => {
          if (!htmlToImageLoad) {
            htmlToImageLoad = (realFetch
              ? realFetch(HTML_TO_IMAGE_SRC, { integrity: HTML_TO_IMAGE_INTEGRITY, credentials: 'omit', referrerPolicy: 'no-referrer' })
              : Promise.reject(new Error('fetch unavailable'))
            )
              .then((res) => {
                if (!res.ok) throw new Error('html-to-image failed to load (' + res.status + ')');
                return res.text();
              })
              .then((source) => {
                // UMD bundle: hide the artifact's AMD/CommonJS globals so it takes the
                // window-global branch; inline script text runs synchronously on insert.
                const hidden = ['define', 'module', 'exports'].map((k) => {
                  const entry = { k, own: Object.prototype.hasOwnProperty.call(window, k), v: window[k] };
                  try { window[k] = undefined; } catch (e) {}
                  return entry;
                });
                try {
                  const el = document.createElement('script');
                  el.text = source;
                  (document.head || document.documentElement).appendChild(el);
                } finally {
                  hidden.forEach(({ k, own, v }) => {
                    try { if (own) { window[k] = v; } else { delete window[k]; } } catch (e) {}
                  });
                }
                if (!window.htmlToImage) throw new Error('html-to-image unavailable after load');
                return window.htmlToImage;
              });
            // A failed load may be transient; let the next screenshot retry.
            htmlToImageLoad.catch(() => { htmlToImageLoad = null; });
          }
          return htmlToImageLoad;
        };
        // crypto.randomUUID exists only in Secure Contexts; fall back to a
        // unique non-crypto id elsewhere (http://LAN-IP dev flows) —
        // uniqueness is what the bridge needs, unpredictability is
        // defense-in-depth on top of the source guards.
        const newRequestId =
          cryptoObj && typeof cryptoObj.randomUUID === "function"
            ? function () { return cryptoObj.randomUUID(); }
            : function () { return Date.now() + "-" + Math.random(); };
        const originalConsole = window.console;
        window.console = {
          log: (...args) => {
            originalConsole.log(...args);
            realParent.postMessage({ type: 'console', message: args.join(' ') }, '*');
          },
          error: (...args) => {
            originalConsole.error(...args);
            realParent.postMessage({ type: 'console', message: 'Error: ' + args.join(' ') }, '*');
          },
          warn: (...args) => {
            originalConsole.warn(...args);
            realParent.postMessage({ type: 'console', message: 'Warning: ' + args.join(' ') }, '*');
          }
        };

        // Bridge request ids are crypto-random (not sequential) so they
        // cannot be predicted by other frames in the tab.
        let callbacksMap = new Map();
        let streamControllers = new Map();
        
        window.claude = {
          complete: (prompt) => {
            return new Promise((resolve, reject) => {
              const id = newRequestId();
              callbacksMap.set(id, { resolve, reject });
              realParent.postMessage({ type: 'claudeComplete', id, prompt }, '*');
            });
          }
        };

        window.storage = {
          get: (key, shared = false) => {
            return new Promise((resolve, reject) => {
              const id = newRequestId();
              callbacksMap.set(id, { resolve, reject });
              realParent.postMessage({ type: 'storageGet', id, key, shared }, '*');
            });
          },
          set: (key, value, shared = false) => {
            return new Promise((resolve, reject) => {
              const id = newRequestId();
              callbacksMap.set(id, { resolve, reject });
              realParent.postMessage({ type: 'storageSet', id, key, value, shared }, '*');
            });
          },
          delete: (key, shared = false) => {
            return new Promise((resolve, reject) => {
              const id = newRequestId();
              callbacksMap.set(id, { resolve, reject });
              realParent.postMessage({ type: 'storageDelete', id, key, shared }, '*');
            });
          },
          list: (prefix, shared = false) => {
            return new Promise((resolve, reject) => {
              const id = newRequestId();
              callbacksMap.set(id, { resolve, reject });
              realParent.postMessage({ type: 'storageList', id, prefix, shared }, '*');
            });
          }
        };

        let pendingBlobs = new Map();
        URL.createObjectURL = (blob) => {
          // Store the blob and create an ID and URL for it
          const blobId = `blob-${Date.now()}-${Math.random()}`;
          pendingBlobs.set(blobId, blob);
          return `blob-request://${blobId}`;
        };

        URL.revokeObjectURL = (url) => {
          // Remove the blob from our store
          const blobId = url.replace("blob-request://", "");
          pendingBlobs.delete(blobId);
        };

        const getBlobFromURL = (url) => {
          const blobId = url.replace("blob-request://", "");
          return pendingBlobs.get(blobId);
        };

        // Override global fetch with streaming support
        window.fetch = (url, init = {}) => {
          return new Promise((resolve, reject) => {
            const id = newRequestId();
            const channelId = `fetch-${id}-${Date.now()}`;
            
            callbacksMap.set(id, { 
              resolve: (response) => {
                // Null-body statuses: Response(stream, {status: 204}) throws
                // per the Fetch spec, which would escape this resolver and
                // hang the artifact's await forever.
                if (response.status === 204 || response.status === 205 || response.status === 304) {
                  try {
                    resolve(new Response(null, {
                      status: response.status,
                      statusText: response.statusText,
                      headers: response.headers
                    }));
                  } catch (err) {
                    // Invalid statusText/header bytes can throw here too.
                    reject(new TypeError(
                      'Bridge fetch: unconstructable response (status ' + response.status + ')'
                    ));
                  }
                  return;
                }
                // Create a ReadableStream for the response body
                const stream = new ReadableStream({
                  start(controller) {
                    streamControllers.set(channelId, controller);
                  },
                  cancel() {
                    streamControllers.delete(channelId);
                  }
                });
                
                // Create and return the Response with the stream. Response()
                // requires status in [200, 599]; an opaque/no-cors fetch
                // forwards status 0, which would throw here and escape the
                // resolver, hanging the artifact's await. Surface it as a
                // network-error-shaped rejection instead.
                try {
                  resolve(new Response(stream, {
                    status: response.status,
                    statusText: response.statusText,
                    headers: response.headers
                  }));
                } catch (err) {
                  streamControllers.delete(channelId);
                  reject(new TypeError(
                    'Bridge fetch: unconstructable response (status ' + response.status + ')'
                  ));
                }
              },
              reject,
              channelId
            });
            
            realParent.postMessage({
              type: 'proxyFetch',
              id,
              url,
              init,
              channelId
            }, '*');
          });
        };

        window.addEventListener('message', async (event) => {
          // Only the embedding parent may drive the bridge — sibling and
          // nested frames can also postMessage into this window.
          if (event.source !== realParent) return;
          if (event.data.type === 'takeScreenshot') {
            // Echo the request's nonce so the requester can correlate the
            // reply to ITS request — a reply without the expected nonce
            // (e.g. from a stale pre-remount artifact) is ignored upstream.
            const screenshotNonce = event.data.nonce;
            const rootElement = document.getElementById('artifacts-component-root-html');
            if (!rootElement) {
              realParent.postMessage({
                type: 'screenshotError',
                nonce: screenshotNonce,
                error: new Error('Root element not found'),
              }, '*');
              return;
            }
            // Catch CDN load failures and toPng errors so the parent always
            // gets a response instead of hanging forever.
            try {
              const htmlToImage = await loadHtmlToImage();
              const screenshot = await htmlToImage.toPng(rootElement, {
                imagePlaceholder:
                  "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAAXNSR0IArs4c6QAAAA1JREFUGFdjePDgwX8ACOQDoNsk0PMAAAAASUVORK5CYII=",
              });
              realParent.postMessage({
                type: 'screenshotData',
                nonce: screenshotNonce,
                data: screenshot,
              }, '*');
            } catch (err) {
              realParent.postMessage({
                type: 'screenshotError',
                nonce: screenshotNonce,
                error: err instanceof Error ? err : new Error(String(err)),
              }, '*');
            }
          } else if (event.data.type === 'claudeComplete') {
            const callback = callbacksMap.get(event.data.id);
            if (!callback) return;
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.completion);
            }
            callbacksMap.delete(event.data.id);
          } else if (event.data.type === 'proxyFetchResponse') {
            const callback = callbacksMap.get(event.data.id);
            if (!callback) return;
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
              callbacksMap.delete(event.data.id);
            } else {
              // Initial response with headers, status, etc.
              callback.resolve({
                status: event.data.status,
                statusText: event.data.statusText,
                headers: event.data.headers
              });
              // Don't delete the callback yet if streaming
              if (!event.data.body) {
                callbacksMap.delete(event.data.id);
              }
            }
          } else if (event.data.type === 'proxyFetchStream') {
            // Handle streaming data chunks
            const controller = streamControllers.get(event.data.channelId);
            if (controller) {
              if (event.data.error) {
                controller.error(new Error(event.data.error));
                streamControllers.delete(event.data.channelId);
              } else if (event.data.done) {
                controller.close();
                streamControllers.delete(event.data.channelId);
                // Clean up the callback
                const callback = Array.from(callbacksMap.entries()).find(
                  ([_, value]) => value.channelId === event.data.channelId
                );
                if (callback) {
                  callbacksMap.delete(callback[0]);
                }
              } else if (event.data.chunk) {
                controller.enqueue(new Uint8Array(event.data.chunk));
              }
            }
          } else if (event.data.type === 'storageGet') {
            const callback = callbacksMap.get(event.data.id);
            if (!callback) return;
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          } else if (event.data.type === 'storageSet') {
            const callback = callbacksMap.get(event.data.id);
            if (!callback) return;
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          } else if (event.data.type === 'storageDelete') {
            const callback = callbacksMap.get(event.data.id);
            if (!callback) return;
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          } else if (event.data.type === 'storageList') {
            const callback = callbacksMap.get(event.data.id);
            if (!callback) return;
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          }
        });

        window.addEventListener('click', (event) => {
          const isEl = event.target instanceof HTMLElement;
          if (!isEl) return;
    
          // find ancestor links
          const linkEl = event.target.closest("a");
          if (!linkEl || !linkEl.href) return;
    
          event.preventDefault();
          event.stopImmediatePropagation();
    
          if (linkEl.href.startsWith("blob-request:")) {
            const blob = getBlobFromURL(linkEl.href);
            if (!blob) return;
            void blob.arrayBuffer().then((data) => {
              realParent.postMessage({
                type: "downloadFile",
                filename: linkEl.download,
                data,
                mimeType: blob.type || "application/octet-stream",
              });
            });
          } else if (linkEl.href.startsWith("data:")) {
            const [header, base64Data] = linkEl.href.split(",");
            const mimeMatch = header.match(/data:([^;]+)/);
            const mimeType = mimeMatch ? mimeMatch[1] : "application/octet-stream";
            const binaryString = atob(base64Data);
            const data = Uint8Array.from(binaryString, (c) =>
              c.charCodeAt(0),
            ).buffer;
            realParent.postMessage({
              type: "downloadFile",
              filename: linkEl.download,
              data,
              mimeType,
            });
          } else {
            let linkUrl;
            try {
              linkUrl = new URL(linkEl.href);
            } catch (error) {
              return;
            }
    
            if (linkUrl.hostname === window.location.hostname) return;
      
            realParent.postMessage({
              type: 'openExternal',
              href: linkEl.href,
            }, '*');
          }
      });

        const originalOpen = window.open;
        window.open = function (url) {
          realParent.postMessage({
            type: "openExternal",
            href: url,
          }, "*");
        };

        window.addEventListener('error', (event) => {
          realParent.postMessage({ type: 'console', message: 'Uncaught Error: ' + event.message }, '*');
        });
      })();
    </script>

<title>代購小幫手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3ECE1;
    --card:#FFFDF9;
    --mocha:#8B6F4E;
    --mocha-dark:#6E5638;
    --taupe:#D9C7AE;
    --taupe-light:#EFE5D5;
    --text:#4A3B2F;
    --text-soft:#8A7A68;
    --danger:#C77B6C;
    --danger-bg:#F7E7E3;
    --shadow: 0 2px 10px rgba(139,111,78,0.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    padding-bottom:78px;
    -webkit-user-select:none; user-select:none;
  }
  input, textarea{ user-select:text; -webkit-user-select:text; }
  header{
    padding:calc(20px + env(safe-area-inset-top)) 18px 16px; background:var(--bg);
    margin-bottom:16px;
    border-bottom:1px solid rgba(139,111,78,0.14);
    position:sticky; top:0; z-index:5;
  }
  .header-row{ display:flex; align-items:center; gap:13px; }
  .header-avatar{
    width:46px; height:46px; border-radius:50%; object-fit:cover; flex-shrink:0;
    border:2px solid var(--taupe); box-shadow:0 2px 5px rgba(139,111,78,0.15);
  }
  .settings-btn{
    position:absolute; top:calc(16px + env(safe-area-inset-top)); right:18px;
    width:34px; height:34px; border-radius:50%; padding:0;
    background:transparent; color:var(--mocha);
    display:flex; align-items:center; justify-content:center;
  }
  .settings-btn svg{ width:19px; height:19px; }
  header h1{
    font-family:'Noto Serif TC', serif; font-size:21px; font-weight:900;
    margin:0 0 3px; letter-spacing:0.5px; color:var(--mocha-dark);
  }
  header .sub{ font-size:12px; color:var(--text-soft); letter-spacing:0.2px; }
  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; background:#FFFDF9;
    display:flex; border-radius:24px 24px 0 0;
    box-shadow:0 -2px 12px rgba(139,111,78,0.10);
    padding-bottom:env(safe-area-inset-bottom); z-index:10;
  }
  nav.tabbar button{
    flex:1; background:none; border-radius:0; padding:10px 4px 8px;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    color:var(--text-soft); font-weight:500; font-size:11px;
  }
  nav.tabbar button .ic{
    width:34px; height:26px; display:flex; align-items:center; justify-content:center;
    border-radius:12px; color:var(--text-soft);
    transition: background .18s ease, color .18s ease;
  }
  nav.tabbar button .ic svg{ width:20px; height:20px; display:block; }
  nav.tabbar button.active{ color:var(--mocha-dark); font-weight:700; }
  nav.tabbar button.active .ic{ background:var(--taupe-light); color:var(--mocha-dark); }
  main{ padding:0 14px 20px; }
  .card{
    background:var(--card); border-radius:22px; padding:16px;
    margin-bottom:14px; box-shadow:var(--shadow);
  }
  .row{ display:flex; gap:8px; align-items:center; }
  .row + .row{ margin-top:8px; }
  input[type=text], input[type=number]{
    flex:1; border:1px solid var(--taupe); background:#FBF8F3;
    border-radius:14px; padding:11px 14px; font-size:16px; color:var(--text);
    min-width:0;
  }
  input:focus{ outline:none; border-color:var(--mocha); background:#fff; }
  button{
    border:none; border-radius:14px; padding:11px 16px; font-size:14.5px;
    font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .btn-main{ background:var(--mocha); color:#fff; }
  .btn-main:active{ background:var(--mocha-dark); }
  .btn-ghost{ background:var(--taupe-light); color:var(--mocha-dark); }
  .btn-danger{ background:var(--danger-bg); color:var(--danger); }
  .btn-block{ width:100%; padding:13px; font-size:15.5px; border-radius:18px; }
  .btn-sm{ padding:7px 12px; font-size:13px; border-radius:12px; }
  .empty{
    text-align:center; color:var(--text-soft); font-size:14px;
    padding:40px 20px; line-height:1.8;
  }
  .empty .emoji{ font-size:34px; display:block; margin-bottom:10px; }
  .hint{ font-size:12.5px; color:var(--mocha); margin-top:4px; padding-left:2px; }
  .product-card{ background:var(--taupe-light); border-radius:20px; padding:14px; margin-bottom:12px; }
  .product-head{ display:flex; justify-content:space-between; align-items:flex-start; }
  .product-name{ font-size:16px; font-weight:700; }
  .product-price{ font-size:15px; color:var(--mocha-dark); font-weight:700; }
  .order-item{
    display:flex; justify-content:space-between; align-items:center;
    font-size:13.5px; padding:8px 12px; margin-top:8px;
    background:#fff; border-radius:12px; box-shadow:0 1px 4px rgba(139,111,78,0.08);
  }
  .order-item .del{ color:var(--danger); font-size:12px; padding:4px 8px; }
  .tag{ display:inline-block; font-size:11.5px; background:var(--taupe-light); color:var(--mocha-dark); padding:2px 8px; border-radius:20px; margin-left:6px; }
  .tag-blacklist{ display:inline-block; font-size:11.5px; background:#F3DAD5; color:#B5423A; padding:2px 8px; border-radius:20px; margin-left:6px; }
  .summary-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 14px; border-radius:16px; background:var(--taupe-light);
    margin-bottom:8px;
  }
  .summary-row:last-child{ margin-bottom:0; }
  .summary-name{ font-weight:700; font-size:15px; }
  .summary-items{ font-size:12px; color:var(--text-soft); margin-top:2px; }
  .summary-total{ font-weight:700; color:var(--mocha-dark); font-size:15px; }
  .profit-line{ display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:14px; }
  .profit-total{ font-weight:800; font-size:16.5px; color:var(--mocha-dark); border-top:1px dashed var(--taupe); margin-top:6px; padding-top:12px; }
  .status-chip{
    font-size:11.5px; padding:6px 11px; border-radius:20px; background:var(--taupe-light);
    color:var(--text-soft); font-weight:700; border:none;
  }
  .status-chip.chip-on{ background:#DCEAD9; color:#4C7A52; }
  .count-badge{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:19px; height:19px; padding:0 5px; border-radius:10px;
    background:var(--taupe-light); color:var(--mocha-dark); font-size:11px; font-weight:700;
    margin-left:6px; vertical-align:middle;
  }
  .expand-tri{
    background:none; border:none; padding:2px 4px; margin-left:2px;
    color:var(--text-soft); font-size:10px; vertical-align:middle;
  }
  .fav-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:10px; -webkit-overflow-scrolling:touch; }
  .fav-chip{
    white-space:nowrap; flex-shrink:0; font-size:12.5px; padding:8px 12px;
    border-radius:20px; background:var(--taupe-light); color:var(--mocha-dark); font-weight:600;
  }
  .region-select{
    flex:1; border:1px solid var(--taupe); background:#FBF8F3;
    border-radius:14px; padding:11px 14px; font-size:15px; color:var(--text);
  }
  .stat-grid{ display:flex; gap:10px; }
  .stat-box{ flex:1; background:var(--taupe-light); border-radius:16px; padding:10px; text-align:center; }
  .stat-box .num{ font-size:18px; font-weight:800; color:var(--mocha-dark); }
  .stat-box .label{ font-size:11px; color:var(--text-soft); margin-top:2px; }
  .view{ display:none; }
  .view.active{ display:block; }
  .list-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px; border-radius:18px; background:var(--card);
    box-shadow:0 1px 5px rgba(139,111,78,0.07); margin-bottom:8px;
  }
  .list-row:last-child{ margin-bottom:0; }
  .list-row .name{ font-weight:700; font-size:15px; }
  .list-row .meta{ font-size:12px; color:var(--text-soft); margin-top:2px; }
  .search-box{ margin-bottom:12px; }
  .search-box input[type=text]{
    border:none; border-radius:18px; background:var(--card); padding:14px 16px;
    box-shadow:0 1px 5px rgba(139,111,78,0.07); font-size:16px;
  }
  .search-box input[type=text]:focus{ background:#fff; box-shadow:0 1px 6px rgba(139,111,78,0.14); }
  /* modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(74,59,47,0.45);
    display:none; align-items:flex-end; z-index:50;
  }
  .modal-backdrop.show{ display:flex; }
  .modal-sheet{
    background:#FFFDF9; width:100%; border-radius:26px 26px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:82vh; overflow-y:auto; animation:slideUp .22s ease;
  }
  @keyframes slideUp{ from{ transform:translateY(24px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  .modal-title{ font-size:17px; font-weight:800; margin-bottom:4px; }
  .modal-sub{ font-size:12.5px; color:var(--text-soft); margin-bottom:14px; }
  .modal-actions{ display:flex; gap:10px; margin-top:16px; }
  .modal-actions button{ flex:1; }
  .toast{
    position:fixed; bottom:calc(92px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%) translateY(10px);
    background:var(--mocha-dark); color:#fff; padding:10px 18px; border-radius:30px;
    font-size:13.5px; opacity:0; pointer-events:none; transition:all .25s ease; z-index:60;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .fab-start{ text-align:center; padding:30px 10px; }
  .history-item{ display:flex; justify-content:space-between; font-size:13.5px; padding:6px 0; }
  h3.section-title{ font-size:13px; color:var(--text-soft); margin:18px 0 8px 2px; font-weight:700; letter-spacing:0.5px; }
</style>
</head>

<script>
/* ---------------- 資料層 ---------------- */
const STORAGE_KEY = 'daigouAppData_v1';

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { currentTrip:null, trips:[], customers:{}, priceHistory:{}, favoriteProducts:[], vipThreshold:3000, blacklist:{} };
}
let data = loadData();
if(!data.favoriteProducts) data.favoriteProducts = [];
if(data.vipThreshold == null) data.vipThreshold = 3000;
if(!data.blacklist) data.blacklist = {};
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

function genId(){ return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7); }

function formatDate(d){
  const dt = new Date(d);
  return `${dt.getFullYear()}/${dt.getMonth()+1}/${dt.getDate()}`;
}
function formatDateTime(d){
  const dt = new Date(d);
  const h = dt.getHours().toString().padStart(2,'0');
  const m = dt.getMinutes().toString().padStart(2,'0');
  return `${formatDate(dt)} ${h}:${m}`;
}
function money(n){ return 'NT$' + Number(n).toLocaleString(); }

/* ---------------- Toast / Modal ---------------- */
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 1800);
}
function closeModal(){
  document.getElementById('modalBackdrop').classList.remove('show');
  document.getElementById('modalSheet').innerHTML = '';
}
function openModal(html){
  document.getElementById('modalSheet').innerHTML = html;
  document.getElementById('modalBackdrop').classList.add('show');
}
document.getElementById('modalBackdrop').addEventListener('click', (e)=>{
  if(e.target.id === 'modalBackdrop') closeModal();
});
function showConfirm(title, sub, confirmLabel, onConfirm){
  openModal(`
    <div class="modal-title">${title}</div>
    <div class="modal-sub">${sub}</div>
    <div class="modal-actions">
      <button class="btn-ghost btn-block" onclick="closeModal()">取消</button>
      <button class="btn-danger btn-block" id="confirmBtn">${confirmLabel}</button>
    </div>
  `);
  document.getElementById('confirmBtn').onclick = ()=>{ closeModal(); onConfirm(); };
}

/* ---------------- 設定：匯出 / 匯入 ---------------- */
function openSettings(){
  openModal(`
    <div class="modal-title">⚙️ 設定</div>
    <div class="modal-sub">備份、還原資料，調整常客門檻</div>
    <div class="card" style="margin-bottom:14px;">
      <div style="font-weight:700; margin-bottom:8px;">⭐ VIP 門檻</div>
      <div class="row">
        <span style="flex:1; font-size:13px; color:var(--text-soft);">累積消費達到這個金額，顧客記錄會自動標記 VIP</span>
      </div>
      <div class="row" style="margin-top:8px;">
        <span style="flex:1; font-size:14px;">門檻金額</span>
        <input type="number" value="${data.vipThreshold || ''}" placeholder="0" style="max-width:120px; text-align:right;" inputmode="decimal" onchange="updateVipThreshold(this.value)">
      </div>
    </div>
    <button class="btn-ghost btn-block" style="margin-bottom:14px;" onclick="openBlacklistManager()">🚫 跑單黑名單管理</button>
    <button class="btn-ghost btn-block" style="margin-bottom:14px;" onclick="copySourceCode()">💻 複製完整程式碼</button>
    <button class="btn-main btn-block" onclick="exportData()">📤 匯出資料</button>
    <button class="btn-ghost btn-block" style="margin-top:10px;" onclick="document.getElementById('importFileInput').click()">📥 匯入資料</button>
    <input type="file" id="importFileInput" accept="application/json,.json" style="display:none;" onchange="handleImportFile(this)">
    <div style="font-size:12px; color:var(--text-soft); margin-top:14px; line-height:1.7;">
      匯出後可以傳到雲端硬碟、傳訊息給自己，或存到「檔案」App 備份起來；換手機或重新安裝時，用匯入把資料讀回來就好。<br>
      ⚠️ 匯入會直接覆蓋目前手機上的所有場次、顧客、價格資料，請先確認備份檔沒問題。
    </div>
    <button class="btn-ghost btn-block" style="margin-top:14px;" onclick="closeModal()">關閉</button>
  `);
}

async function exportData(){
  const json = JSON.stringify(data, null, 2);
  const filename = `代購資料備份_${formatDate(new Date()).replace(/\//g,'-')}.json`;
  try{
    const file = new File([json], filename, { type:'application/json' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:'代購資料備份' });
      return;
    }
  }catch(e){ /* 使用者取消分享，或裝置不支援，改用下載 */ }
  try{
    const blob = new Blob([json], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 3000);
    toast('已匯出備份檔 📤');
  }catch(e){
    toast('匯出失敗，請稍後再試');
  }
}

function handleImportFile(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    let parsed;
    try{ parsed = JSON.parse(e.target.result); }
    catch(err){ toast('這個檔案打不開，格式不正確'); inputEl.value=''; return; }
    if(!parsed || typeof parsed !== 'object' || !('customers' in parsed) || !('priceHistory' in parsed)){
      toast('這不是代購小幫手的備份檔喔'); inputEl.value=''; return;
    }
    showConfirm('確定要匯入這份備份？', '匯入後會覆蓋目前手機上所有的場次、顧客、價格資料，且無法復原。', '確定匯入', ()=>{
      data = parsed;
      if(!data.trips) data.trips = [];
      if(!data.customers) data.customers = {};
      if(!data.priceHistory) data.priceHistory = {};
      if(!data.favoriteProducts) data.favoriteProducts = [];
      if(data.vipThreshold == null) data.vipThreshold = 3000;
      if(!data.blacklist) data.blacklist = {};
      if(data.currentTrip === undefined) data.currentTrip = null;
      saveData();
      renderSession(); renderCustomers(); renderPrices(); renderHistory();
      toast('資料已匯入 🎉');
    });
    inputEl.value = '';
  };
  reader.readAsText(file);
}

/* ---------------- 一鍵複製結算文字 ---------------- */
function copyToClipboard(text, successMsg){
  successMsg = successMsg || '已複製，可以貼到群組了 📋';
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(
      ()=> toast(successMsg),
      ()=> fallbackCopy(text, successMsg)
    );
  } else {
    fallbackCopy(text, successMsg);
  }
}
function fallbackCopy(text, successMsg){
  successMsg = successMsg || '已複製，可以貼到群組了 📋';
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast(successMsg);
  }catch(e){
    toast('複製失敗，請手動選取文字');
  }
}
function copySourceCode(){
  fetch(window.location.href, { cache:'no-store' })
    .then(res=>{ if(!res.ok) throw new Error('fetch failed'); return res.text(); })
    .then(text=> copyToClipboard(text, '已複製整個程式碼 💻'))
    .catch(()=>{
      const fallback = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      copyToClipboard(fallback, '已複製目前頁面內容 💻（可能跟原始檔案有些微差異）');
    });
}
function buildCustomerSummaryText(trip, name, info){
  const extraShip = (trip.customerExtraShipping && trip.customerExtraShipping[name]) || 0;
  const note = (trip.customerNotes && trip.customerNotes[name]) || '';
  let text = `🐻 ${name}\n`;
  info.items.forEach(it=>{ text += `・${it.name} ×${it.qty} = ${money(it.subtotal)}\n`; });
  if(extraShip > 0){ text += `・運費 = ${money(extraShip)}\n`; }
  text += `合計：${money(info.total + extraShip)}`;
  if(note){ text += `\n🎁 這次附贈：${note}`; }
  return text;
}
function copyCustomerSummary(encName){
  const name = decodeURIComponent(encName);
  const trip = data.currentTrip;
  if(!trip) return;
  const summary = computeTripSummary(trip);
  const info = summary[name];
  if(!info) return;
  copyToClipboard(buildCustomerSummaryText(trip, name, info));
}
function copyTripCustomerSummary(tripId, encName){
  const t = data.trips.find(x=>x.id===tripId);
  if(!t) return;
  const name = decodeURIComponent(encName);
  const summary = computeTripSummary(t);
  const info = summary[name];

    data.trips = data.trips.filter(t=>t.id!==tripId);
    Object.keys(data.customers).forEach(name=>{
      const c = data.customers[name];
      c.history = c.history.filter(h=>h.tripId!==tripId);
      c.totalSpent = c.history.reduce((s,h)=>s+h.amount, 0);
      c.orderCount = c.history.length;
      if(c.history.length === 0) delete data.customers[name];
    });
    Object.keys(data.priceHistory).forEach(name=>{
      const p = data.priceHistory[name];
      p.records = p.records.filter(r=>r.tripId!==tripId);
      if(p.records.length === 0) delete data.priceHistory[name];
    });

    renderHistory();

function computeTripSummary(trip){
  const map = {};
  trip.orders.forEach(o=>{
    const product = trip.products.find(p=>p.id===o.productId);
    if(!product) return;
    if(!map[o.customerName]) map[o.customerName] = { items:[], total:0 };
    const subtotal = product.price * o.qty;
    map[o.customerName].items.push({ name: product.name, qty: o.qty, price: product.price, subtotal, orderId: o.id, productId: product.id });
    map[o.customerName].total += subtotal;
  });
  return map;
}

function computeTripFinancials(trip){
  let revenue = 0, costTotal = 0;
  trip.orders.forEach(o=>{
    const product = trip.products.find(p=>p.id===o.productId);
    if(!product) return;
    revenue += product.price * o.qty;
    costTotal += (product.cost||0) * o.qty;
  });
  const grossProfit = revenue - costTotal;
  const shippingTotal = Object.values(trip.customerShipping||{}).reduce((s,v)=>s+(v||0), 0);
  const netProfit = grossProfit - shippingTotal;
  return { revenue, costTotal, grossProfit, shippingTotal, netProfit };
}

function settleTrip(){
  const trip = data.currentTrip;
  if(!trip) return;
  if(trip.products.length === 0){ toast('這場次還沒有商品喔'); return; }
  const summary = computeTripSummary(trip);
  const customerCount = Object.keys(summary).length;
  if(customerCount === 0){
    showConfirm('這場次還沒有人加單', '確定要直接結束嗎？(不會記錄到顧客資料)', '直接結束', ()=>{
      data.currentTrip = null; saveData(); renderSession();
    });
    return;
  }
  showConfirm('結算並結束此場次？', `共 ${customerCount} 位顧客加單，結算後會存進顧客記錄和價格記錄。`, '結算完成', ()=>{
    Object.entries(summary).forEach(([name, info])=>{
      if(!data.customers[name]) data.customers[name] = { name, totalSpent:0, orderCount:0, history:[] };
      data.customers[name].totalSpent += info.total;
      data.customers[name].orderCount += 1;
      data.customers[name].history.unshift({
        tripId: trip.id, tripName: trip.name, date: trip.date, amount: info.total,
        items: info.items.map(it=>({ name: it.name, qty: it.qty, price: it.price })),
        note: (trip.customerNotes && trip.customerNotes[name]) || ''
      });
    });
    trip.products.forEach(p=>{
      if(!data.priceHistory[p.name]) data.priceHistory[p.name] = { name: p.name, records: [] };
      data.priceHistory[p.name].records.unshift({ price: p.price, cost: p.cost||0, date: trip.date, tripName: trip.name, tripId: trip.id });
    });
    const fin = computeTripFinancials(trip);
    data.trips.unshift({
      ...trip, settledAt: Date.now(), customerCount,
      totalRevenue: fin.revenue, costTotal: fin.costTotal, grossProfit: fin.grossProfit,
      shippingTotal: fin.shippingTotal, profit: fin.netProfit
    });
    data.currentTrip = null;
    saveData();
    renderSession();
    toast('場次結算完成 🎉');
  });
}

          <select class="region-select" onchange="favRegionFilter=this.value; renderSession();">
            <option value="" ${favRegionFilter?'':'selected'} disabled>請選擇地區</option>
            ${regions.map(r=>`<option value="${escapeHtml(r)}" ${favRegionFilter===r?'selected':''}>${escapeHtml(r)}</option>`).join('')}
            ${hasUnclassified ? `<option value="__none__" ${favRegionFilter==='__none__'?'selected':''}>未分類</option>` : ''}
          </select>
        </div>`;

        let filteredFavs = [];
        if(favRegionFilter === '__none__') filteredFavs = data.favoriteProducts.filter(f=>!f.region);
        else if(favRegionFilter) filteredFavs = data.favoriteProducts.filter(f=>f.region===favRegionFilter);

        if(!favRegionFilter){
          out += `<div style="font-size:12px; color:var(--text-soft); margin-bottom:10px;">👆 選一個地區，常用商品才會出現</div>`;
        } else {
          out += `<div class="fav-row">
            ${filteredFavs.map(f=>`<button class="fav-chip" onclick="fillFavoriteProduct('${encodeURIComponent(f.name)}')">⭐ ${escapeHtml(f.name)} · ${money(f.price)}</button>`).join('')}
          </div>`;
          if(filteredFavs.length === 0){
            out += `<div style="font-size:12px; color:var(--text-soft); margin:-4px 0 10px;">這個地區還沒有常用商品</div>`;
          }
        }
        return out;
      })()}
      <div class="row">
        <input type="text" id="prodName" list="productNameList" placeholder="商品名稱">
      </div>
      <div class="row">
        <input type="number" id="prodPrice" placeholder="售價" inputmode="decimal">
        <input type="number" id="prodCost" placeholder="成本（選填）" inputmode="decimal">
      </div>
      <div class="hint" id="priceHint" style="display:none;"></div>
      <button class="btn-main btn-block" style="margin-top:10px;" onclick="handleAddProduct()">加入商品</button>
      ${productDatalist()}
    </div>
  `;

  html += customerDatalist();

  if(trip.products.length === 0){
    html += `<div class="empty"><span class="emoji">📦</span>還沒有商品，先加第一個商品吧</div>`;
  } else {
    html += `<h3 class="section-title">本場次商品</h3>`;
    trip.products.forEach(p=>{
      const orders = trip.orders.filter(o=>o.productId===p.id);
      const nameInputId = 'oname_'+p.id;
      const qtyInputId = 'oqty_'+p.id;
      html += `
        <div class="product-card">
          <div class="product-head">
            <div class="product-name">🏷️ ${escapeHtml(p.name)}</div>
            <div class="row" style="gap:8px;">
              <div>
                <div class="product-price">${money(p.price)}</div>
                ${p.cost ? `<div style="font-size:11.5px; color:var(--text-soft); text-align:right;">成本 ${money(p.cost)}</div>` : ''}
              </div>
              <button class="btn-ghost btn-sm" onclick="toggleFavoriteProduct('${encodeURIComponent(p.name)}')">${data.favoriteProducts.some(f=>f.name===p.name)?'⭐':'☆'}</button>
              <button class="btn-danger btn-sm" onclick="deleteProduct('${p.id}')">刪除</button>
            </div>
          </div>
          <div class="row" style="margin-top:10px;">
            <input type="text" id="${nameInputId}" list="customerNameList" placeholder="顧客名稱">
            <input type="number" id="${qtyInputId}" placeholder="數量" style="max-width:78px;" inputmode="numeric" value="1">
            <button class="btn-main btn-sm" onclick="addOrder('${p.id}','${nameInputId}','${qtyInputId}')">加單</button>
          </div>
          ${orders.map(o=>`
            <div class="order-item">
              <span>🐻 ${escapeHtml(o.customerName)} × ${o.qty} = ${money(p.price*o.qty)}</span>
              <span class="del" onclick="deleteOrder('${o.id}')">移除</span>
            </div>
          `).join('')}
        </div>
      `;
    });
  }

  if(summaryEntries.length > 0){
    const filteredEntries = summaryEntries.filter(([name])=> name.includes(sessionSummarySearch));
    html += `<h3 class="section-title">目前加單總覽（依金額排序，共 ${summaryEntries.length} 人）</h3>`;
    if(summaryEntries.length > 6){
      html += `<div class="search-box"><input type="text" placeholder="🔍 搜尋這場的顧客" value="${escapeHtml(sessionSummarySearch)}" oninput="sessionSummarySearch=this.value; renderSession();"></div>`;
    }
    html += `<div class="card">`;
    filteredEntries.forEach(([name, info])=>{
      const itemsText = info.items.map(i=> `${i.name}×${i.qty}`).join('、');
      const shipVal = (trip.customerShipping && trip.customerShipping[name]) ? trip.customerShipping[name] : '';
      const extraShipVal = (trip.customerExtraShipping && trip.customerExtraShipping[name]) ? trip.customerExtraShipping[name] : '';
      const extraShip = (trip.customerExtraShipping && trip.customerExtraShipping[name]) || 0;
      const noteVal = (trip.customerNotes && trip.customerNotes[name]) ? trip.customerNotes[name] : '';
      const isPaid = !!(trip.customerPaid && trip.customerPaid[name]);
      const isDelivered = !!(trip.customerDelivered && trip.customerDelivered[name]);
      const isBl = isBlacklisted(name);
      const isExpanded = expandedCustomers.has(name);
      html += `
        <div class="summary-row" style="flex-direction:column; align-items:stretch;">
          ${isBl ? `<div style="font-size:12px; font-weight:700; color:#B5423A; margin-bottom:6px;">🚫 黑名單顧客${data.blacklist[name] ? '：' + escapeHtml(data.blacklist[name]) : ''}</div>` : ''}
          <div class="row" style="justify-content:space-between; align-items:flex-start;">
            <div class="summary-name">🐻 ${escapeHtml(name)}<span class="count-badge">${info.items.length}</span></div>
            <div class="row" style="gap:4px;">
              <div>
                <div class="summary-total">${money(info.total + extraShip)}</div>
                ${extraShip > 0 ? `<div style="font-size:10.5px; color:var(--text-soft); text-align:right;">含運費 ${money(extraShip)}</div>` : ''}
              </div>
              <button class="expand-tri" onclick="toggleCustomerExpand('${encodeURIComponent(name)}')">${isExpanded?'▲':'▾'}</button>
            </div>
          </div>
          <div class="row" style="margin-top:8px; flex-wrap:wrap; gap:6px;">
            <button class="status-chip ${isPaid?'chip-on':''}" onclick="toggleCustomerPaid('${encodeURIComponent(name)}')">${isPaid?'✅ 已收款':'💰 待收款'}</button>
            <button class="status-chip ${isDelivered?'chip-on':''}" onclick="toggleCustomerDelivered('${encodeURIComponent(name)}')">${isDelivered?'✅ 已取貨':'📦 待出貨'}</button>
            <button class="status-chip" onclick="copyCustomerSummary('${encodeURIComponent(name)}')">📋 複製訂單</button>
          </div>
          ${isExpanded ? `
          <div class="summary-items" style="margin-top:8px;">${escapeHtml(itemsText)}</div>
          <div class="row" style="margin-top:8px;">
            <span style="font-size:12.5px; color:var(--text-soft); flex:1;">🚚 我付運費</span>
            <input type="number" value="${shipVal}" placeholder="0" style="max-width:110px; text-align:right;" inputmode="decimal" onchange="updateCustomerShipping('${encodeURIComponent(name)}', this.value)">
          </div>
          <div class="row" style="margin-top:6px;">
            <span style="font-size:12.5px; color:var(--text-soft); flex:1;">📮 客人需付運費</span>
            <input type="number" value="${extraShipVal}" placeholder="0" style="max-width:110px; text-align:right;" inputmode="decimal" onchange="updateCustomerExtraShipping('${encodeURIComponent(name)}', this.value)">
          </div>
          <div class="row" style="margin-top:6px;">
            <input type="text" value="${escapeHtml(noteVal)}" placeholder="🎁 備註（例如：送了小禮物）" onchange="updateCustomerNote('${encodeURIComponent(name)}', this.value)">
          </div>
          ` : ''}
        </div>
      `;
    });
    if(filteredEntries.length === 0){
      html += `<div class="empty" style="padding:16px;">找不到符合的顧客</div>`;
    }
    html += `</div>`;
  }

  html += `
    <div class="card">
      <div style="font-weight:700; margin-bottom:8px;">💰 淨利試算</div>
      <div class="profit-line"><span>總營收</span><span>${money(fin.revenue)}</span></div>
      <div class="profit-line"><span>商品成本</span><span>− ${money(fin.costTotal)}</span></div>
      <div class="profit-line" style="font-weight:700;"><span>毛利</span><span>${money(fin.grossProfit)}</span></div>
      <div class="profit-line"><span>幫客人代付運費</span><span>− ${money(fin.shippingTotal)}</span></div>
      <div class="profit-line profit-total"><span>預估淨利</span><span id="profitNum">${money(fin.netProfit)}</span></div>
    </div>
  `;

  if(summaryEntries.length > 0){
    html += `<button class="btn-main btn-block" onclick="settleTrip()">✅ 結算並結束此場次</button>`;
  } else {
    html += `<button class="btn-main btn-block" onclick="settleTrip()" style="margin-top:6px;">結束此場次</button>`;
  }

  el.innerHTML = html;

  const nameEl = document.getElementById('prodName');
  if(nameEl){
    nameEl.addEventListener('input', ()=>{
      const key = nameEl.value.trim();
      const hint = document.getElementById('priceHint');
      const rec = data.priceHistory[key];
      if(rec && rec.records.length){
        const last = rec.records[0];
        hint.style.display = 'block';
        hint.textContent = last.cost
          ? `💡 上次賣 ${money(last.price)}，成本 ${money(last.cost)}（${last.tripName}，${formatDate(last.date)}）`
          : `💡 上次開價 ${money(last.price)}（${last.tripName}，${formatDate(last.date)}）`;
      } else {
        hint.style.display = 'none';
      }
    });
  }
}

function handleAddProduct(){
  const name = document.getElementById('prodName').value;
  const price = document.getElementById('prodPrice').value;
  const cost = document.getElementById('prodCost').value;
  addProduct(name, price, cost);
  document.getElementById('prodName').value='';
  document.getElementById('prodPrice').value='';
  document.getElementById('prodCost').value='';
  document.getElementById('priceHint').style.display='none';
}

function productDatalist(){
  const names = Object.keys(data.priceHistory);
  return `<datalist id="productNameList">${names.map(n=>`<option value="${escapeHtml(n)}">`).join('')}</datalist>`;
}
function customerDatalist(){
  const names = new Set(Object.keys(data.customers));
  if(data.currentTrip) data.currentTrip.orders.forEach(o=>names.add(o.customerName));
  return `<datalist id="customerNameList">${[...names].map(n=>`<option value="${escapeHtml(n)}">`).join('')}</datalist>`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- 畫面：顧客記錄 ---------------- */
let customerSearch = '';
let priceSearch = '';
let sessionSummarySearch = '';
let favRegionFilter = '';
let expandedCustomers = new Set();
function toggleCustomerExpand(encName){
  const name = decodeURIComponent(encName);
  if(expandedCustomers.has(name)) expandedCustomers.delete(name);
  else expandedCustomers.add(name);
  renderSession();
}
function renderCustomers(){
  const el = document.getElementById('view-customers');
  const list = Object.values(data.customers)
    .filter(c => c.name.includes(customerSearch))
    .sort((a,b)=> b.totalSpent - a.totalSpent);

  let html = `
    <div class="search-box">
      <input type="text" placeholder="🔍 搜尋顧客名稱" value="${escapeHtml(customerSearch)}" oninput="customerSearch=this.value; renderCustomers();">
    </div>
  `;

  if(list.length === 0){
    html += `<div class="empty"><span class="emoji">🥰</span>結算場次後，顧客記錄會自動出現在這裡</div>`;
  } else {
    list.forEach(c=>{
      const isVip = data.vipThreshold > 0 && c.totalSpent >= data.vipThreshold;
      const isBl = isBlacklisted(c.name);
      html += `
        <div class="list-row" onclick="openCustomerDetail('${encodeURIComponent(c.name)}')">
          <div>
            <div class="name">🐻 ${escapeHtml(c.name)} ${isVip ? '<span class="tag">⭐VIP</span>' : ''}${isBl ? '<span class="tag-blacklist">🚫黑名單</span>' : ''}</div>
            <div class="meta">買過 ${c.orderCount} 次場次</div>
          </div>
          <div class="summary-total">${money(c.totalSpent)}</div>
        </div>
      `;
    });
  }
  el.innerHTML = html;
}

function openCustomerDetail(encName){
  const name = decodeURIComponent(encName);
  const c = data.customers[name];
  if(!c) return;
  let html = `
    <div class="modal-title">🐻 ${escapeHtml(c.name)}</div>
    <div class="modal-sub">累計消費 ${money(c.totalSpent)}　·　共 ${c.orderCount} 次</div>
  `;
  c.history.forEach(h=>{
    html += `
      <div class="card" style="margin-bottom:8px;">
        <div class="row" style="justify-content:space-between;">
          <div style="font-weight:700; font-size:13.5px;">${escapeHtml(h.tripName)}</div>
          <div style="font-weight:700; color:var(--mocha-dark);">${money(h.amount)}</div>
        </div>
        <div style="font-size:11.5px; color:var(--text-soft); margin-bottom:6px;">${formatDate(h.date)}</div>
        ${h.items.map(i=>`<div class="history-item"><span>${escapeHtml(i.name)} × ${i.qty}</span><span>${money(i.price*i.qty)}</span></div>`).join('')}
        ${h.note ? `<div style="margin-top:8px; font-size:12.5px; background:var(--taupe-light); color:var(--mocha-dark); padding:7px 10px; border-radius:10px;">🎁 ${escapeHtml(h.note)}</div>` : ''}
      </div>
    `;
  });
  html += `<button class="btn-ghost btn-block" onclick="closeModal()">關閉</button>`;
  html += `<button class="btn-danger btn-block" style="margin-top:10px;" onclick="deleteCustomer('${encodeURIComponent(c.name)}')">🗑️ 刪除這位顧客</button>`;
  openModal(html);
}

/* ---------------- 畫面：商品價格 ---------------- */
function renderPrices(){
  const el = document.getElementById('view-prices');
  const entries = Object.values(data.priceHistory)
    .filter(p => p.name.includes(priceSearch))
    .sort((a,b)=>{
      const da = a.records[0]?.date || 0, db = b.records[0]?.date || 0;
      return new Date(db) - new Date(da);
    });

  if(Object.keys(data.priceHistory).length === 0){
    el.innerHTML = `<div class="empty"><span class="emoji">💰</span>加過的商品價格會自動記在這裡，方便你查上次開多少</div>`;
    return;
  }

  let html = `
    <div class="search-box">
      <input type="text" placeholder="🔍 搜尋商品名稱" value="${escapeHtml(priceSearch)}" oninput="priceSearch=this.value; renderPrices();">
    </div>
  `;
  if(entries.length === 0){
    html += `<div class="empty" style="padding:20px 10px;">找不到符合的商品</div>`;
  }
  entries.forEach(p=>{
    const last = p.records[0];
    html += `
      <div class="list-row" onclick="openPriceDetail('${encodeURIComponent(p.name)}')">
        <div>
          <div class="name">🏷️ ${escapeHtml(p.name)}</div>
          <div class="meta">上次：${p.records[0].tripName} · ${formatDate(last.date)}</div>
        </div>
        <div class="summary-total">${money(last.price)}</div>
      </div>
    `;
  });
  el.innerHTML = html;
}

function openPriceDetail(encName){
  const name = decodeURIComponent(encName);
  const p = data.priceHistory[name];
  if(!p) return;
  let html = `<div class="modal-title">🏷️ ${escapeHtml(p.name)}</div><div class="modal-sub">歷史開價紀錄</div>`;
  p.records.forEach(r=>{
    html += `<div class="history-item"><span>${escapeHtml(r.tripName)} · ${formatDate(r.date)}${r.cost ? '　成本 ' + money(r.cost) : ''}</span><span style="font-weight:700;">${money(r.price)}</span></div>`;
  });
  html += `<button class="btn-ghost btn-block" style="margin-top:14px;" onclick="closeModal()">關閉</button>`;
  html += `<button class="btn-danger btn-block" style="margin-top:10px;" onclick="deletePriceEntry('${encodeURIComponent(p.name)}')">🗑️ 刪除這個商品價格記錄</button>`;
  openModal(html);
}

/* ---------------- 畫面：歷史場次 ---------------- */
function renderHistory(){
  const el = document.getElementById('view-history');
  if(data.trips.length === 0){
    el.innerHTML = `<div class="empty"><span class="emoji">🗂️</span>結算過的場次會顯示在這裡</div>`;
    return;
  }
  let html = '';
  data.trips.forEach(t=>{
    const profit = (t.profit != null) ? t.profit : t.totalRevenue;
    const names = Object.keys(computeTripSummary(t));
    const unpaidCount = names.filter(n=> !(t.customerPaid && t.customerPaid[n])).length;
    const undeliveredCount = names.filter(n=> !(t.customerDelivered && t.customerDelivered[n])).length;
    const badges = [];
    if(unpaidCount > 0) badges.push(`<span style="color:#B5654F;">💰 ${unpaidCount} 人未收款</span>`);
    if(undeliveredCount > 0) badges.push(`<span style="color:#8A7A68;">📦 ${undeliveredCount} 人未出貨</span>`);
    html += `
      <div class="list-row" onclick="openTripDetail('${t.id}')">
        <div>
          <div class="name">${escapeHtml(t.name)}</div>
          <div class="meta">${formatDate(t.date)} · ${t.customerCount} 位顧客 · 總營收 ${money(t.totalRevenue)}</div>
          ${badges.length ? `<div class="meta" style="margin-top:2px;">${badges.join('　')}</div>` : ''}
        </div>
        <div class="summary-total">${money(profit)}</div>
      </div>
    `;
  });
  el.innerHTML = html;
}

function openTripDetail(tripId){
  const t = data.trips.find(x=>x.id===tripId);
  if(!t) return;
  const summary = computeTripSummary(t);
  const entries = Object.entries(summary).sort((a,b)=>b[1].total-a[1].total);
  const costTotal = t.costTotal || 0;
  const grossProfit = (t.grossProfit != null) ? t.grossProfit : t.totalRevenue;
  const shippingTotal = t.shippingTotal != null ? t.shippingTotal : (t.shippingFee || 0);
  const profit = (t.profit != null) ? t.profit : t.totalRevenue;
  let html = `
    <div class="modal-title">${escapeHtml(t.name)}</div>
    <div class="modal-sub">${formatDate(t.date)}</div>
    <div class="card" style="margin-bottom:12px;">
      <div class="profit-line"><span>總營收</span><span>${money(t.totalRevenue)}</span></div>
      <div class="profit-line"><span>商品成本</span><span>− ${money(costTotal)}</span></div>
      <div class="profit-line" style="font-weight:700;"><span>毛利</span><span>${money(grossProfit)}</span></div>
      <div class="profit-line"><span>幫客人代付運費</span><span>− ${money(shippingTotal)}</span></div>
      <div class="profit-line profit-total"><span>淨利</span><span>${money(profit)}</span></div>
    </div>
  `;
  entries.forEach(([name, info])=>{
    const note = (t.customerNotes && t.customerNotes[name]) ? t.customerNotes[name] : '';
    const isPaid = !!(t.customerPaid && t.customerPaid[name]);
    const isDelivered = !!(t.customerDelivered && t.customerDelivered[name]);
    html += `
      <div class="card" style="margin-bottom:8px;">
        <div class="row" style="justify-content:space-between;">
          <div style="font-weight:700; font-size:14px;">🐻 ${escapeHtml(name)}</div>
          <div style="font-weight:700; color:var(--mocha-dark);">${money(info.total)}</div>
        </div>
        ${info.items.map(i=>`<div class="history-item"><span>${escapeHtml(i.name)} × ${i.qty}</span><span>${money(i.subtotal)}</span></div>`).join('')}
        ${note ? `<div style="margin-top:8px; font-size:12.5px; background:var(--taupe-light); color:var(--mocha-dark); padding:7px 10px; border-radius:10px;">🎁 ${escapeHtml(note)}</div>` : ''}
        <div class="row" style="margin-top:10px; flex-wrap:wrap; gap:6px;">
          <button class="status-chip ${isPaid?'chip-on':''}" onclick="toggleTripCustomerPaid('${t.id}','${encodeURIComponent(name)}')">${isPaid?'✅ 已收款':'💰 待收款'}</button>
          <button class="status-chip ${isDelivered?'chip-on':''}" onclick="toggleTripCustomerDelivered('${t.id}','${encodeURIComponent(name)}')">${isDelivered?'✅ 已取貨':'📦 待出貨'}</button>
          <button class="status-chip" onclick="copyTripCustomerSummary('${t.id}','${encodeURIComponent(name)}')">📋 複製訂單</button>
        </div>
      </div>
    `;
  });
  html += `<button class="btn-ghost btn-block" onclick="closeModal()">關閉</button>`;
  html += `<button class="btn-danger btn-block" style="margin-top:10px;" onclick="deleteTripEntry('${t.id}')">🗑️ 刪除這個場次</button>`;
  openModal(html);
}

/* ---------------- Tab 切換 ---------------- */
const renderers = { session: renderSession, customers: renderCustomers, prices: renderPrices, history: renderHistory };
document.querySelectorAll('nav.tabbar button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabbar button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    const tab = btn.dataset.tab;
    document.getElementById('view-'+tab).classList.add('active');
    renderers[tab]();
    if(tab !== 'session'){ document.getElementById('headerSub').textContent =
      tab==='customers' ? '看看誰買過、買了多少' :
      tab==='prices' ? '快速查上次開的價格' : '過去結算過的場次';
    } else {
      renderSession();
    }
  });
});

/* ---------------- 初始渲染 ---------------- */
renderSession();
renderCustomers();
renderPrices();
renderHistory();

/* ---------------- iOS 修正：鍵盤跳出時固定分頁列的位置 ---------------- */
if(window.visualViewport){
  const navEl = document.querySelector('nav.tabbar');
  function fixNavPosition(){
    const vv = window.visualViewport;
    const offset = window.innerHeight - vv.height - vv.offsetTop;
    navEl.style.transform = offset > 0 ? `translateY(-${offset}px)` : '';
  }
  window.visualViewport.addEventListener('resize', fixNavPosition);
  window.visualViewport.addEventListener('scroll', fixNavPosition);
}

/* ---------------- App 回到前景時，自動關閉殘留的彈窗，確保回到目前場次 ---------------- */
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible'){
    closeModal();
  }
});
</script>


</body></html>
